name: Fork PR cache restore without preinstalled hook

on:
  pull_request:
    branches:
      - research/turbo-fork-base

permissions:
  contents: read

jobs:
  untrusted-fork-artifact-nohook:
    if: github.repository == 'gariblog/turborepo-remote-test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check zstandard
          npm ci --no-audit --no-fund
      - name: Confirm runner starts without a pre-commit hook
        run: |
          if test -e .git/hooks/pre-commit; then
            echo "Unexpected pre-existing pre-commit hook"
            exit 1
          fi
          echo "NO_PREINSTALLED_PRE_COMMIT_HOOK"
      - name: Validate fork-committed artifact and restore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence .turbo/cache
          node_modules/.bin/turbo run verify --filter=web --dry=json > evidence/dry-run.json
          expected_hash="$(python -c 'import json; d=json.load(open("evidence/dry-run.json")); print(next(t["hash"] for t in d["tasks"] if t["taskId"]=="web#build"))')"
          committed_hash="d6d64d99a8c9e2ae"
          test "$expected_hash" = "$committed_hash"
          test -f ".turbo/cache/$committed_hash.tar.zst.b64"
          test -f ".turbo/cache/$committed_hash-meta.json"
          base64 --decode ".turbo/cache/$committed_hash.tar.zst.b64" > ".turbo/cache/$committed_hash.tar.zst"
          python - <<'PY'
          import json, pathlib
          h="d6d64d99a8c9e2ae"
          meta=json.loads(pathlib.Path(f".turbo/cache/{h}-meta.json").read_text())
          assert meta["hash"]==h
          pathlib.Path("evidence/task-hash.txt").write_text(h)
          print("FORK_COMMITTED_ARTIFACT_HASH_MATCH:",h)
          PY
          sha256sum ".turbo/cache/$committed_hash.tar.zst" | tee evidence/archive.sha256
          node_modules/.bin/turbo run verify --filter=web 2>&1 | tee evidence/turbo.log
      - name: Assert no-hook behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, subprocess
          root=pathlib.Path(".")
          h=(root/"evidence/task-hash.txt").read_text().strip()
          manifest=root/".turbo"/"cache"/f"{h}-manifest.json"
          hook=root/".git"/"hooks"/"pre-commit"
          text=hook.read_text(errors="replace") if hook.exists() else ""
          executable=bool(hook.exists() and (hook.stat().st_mode & 0o111))
          report={
            "fork_pr_event":True,
            "task_hash":h,
            "build_script_skipped_cache_hit":not (root/"apps/web/build-ran.txt").exists(),
            "cache_output_restored":(root/"apps/web/dist/cache-hit.txt").exists(),
            "manifest_sidecar_is_symlink":manifest.is_symlink(),
            "manifest_symlink_target":os.readlink(manifest) if manifest.is_symlink() else None,
            "hook_created_or_overwritten":hook.exists() and text.lstrip().startswith("{"),
            "hook_executable":executable
          }
          assert report["build_script_skipped_cache_hit"]
          assert report["cache_output_restored"]
          assert report["manifest_sidecar_is_symlink"]
          assert report["manifest_symlink_target"]=="../../.git/hooks/pre-commit"
          assert report["hook_created_or_overwritten"]
          assert not executable, "Unexpected executable hook on a runner with no preinstalled hook"
          subprocess.run(["git","config","user.name","Fork PR Test"],check=True)
          subprocess.run(["git","config","user.email","fork-pr-test@example.invalid"],check=True)
          p=subprocess.run(["git","-c","core.hooksPath=.git/hooks","commit","--allow-empty","-m","verify non-executable hook is ignored"],capture_output=True,text=True)
          report["git_commit_exit_code"]=p.returncode
          report["git_commit_succeeded"]=p.returncode==0
          report["commit_stderr"]=p.stderr[-1500:]
          pathlib.Path("evidence/nohook-summary.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          assert report["git_commit_succeeded"], "Commit should ignore a non-executable hook"
          PY
      - name: Upload fork PR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-pr-nohook-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
